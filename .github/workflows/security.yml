name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  actions-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      # actionlint 1.7.12's bundled metadata for create-github-app-token@v3 predates its
      # client-id input (added as the app-id replacement) — false positive, not a real
      # config error. See action.yml on the v3 tag: client-id and app-id both exist,
      # client-id undocumented on actionlint's end. Run via `docker run` (not
      # `uses: docker://...` + `with: args:`, which splits on bare whitespace with no
      # shell quoting) so the multi-word -ignore patterns survive intact.
      - name: actionlint
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo rhysd/actionlint:1.7.12 -color \
            -ignore 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"' \
            -ignore 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Trivy scan (report — SARIF upload)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          version: v0.74.0

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy scan (blocking — CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.74.0
